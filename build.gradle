import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group 'org.example'
version '1.0.6'
repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        url "https://maven.seedfinding.com"
        }

    maven {
        url "https://maven.latticg.com"
        }

    maven {

        url "https://jitpack.io"

        }
    maven {url "https://repo.jellejurre.dev"}

}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
test {
    useJUnitPlatform()
}

def mainClassName = 'com.sunnyslopes.flowerfarmfinder.FlowerFarmFinderFrame'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// 本仓库只保留 Java GUI；全部 C++ 计算逻辑（CTS + FlowerFarmSearch + cubiomes）
// 在 FlowerFinderBase 子模块里（https://github.com/SunnySlopes/FlowerFinderBase）。
//
// 契约：
//   FlowerFinderBase/build/bin/libFlowerFarmFinderLibJ.dll
//     -> jar 内 /native/windows/libFlowerFarmFinderLibJ.dll
//   由 FlowerFinderBase/jni/build-jni.bat 构建，JNI 类/方法签名不变
//   （com.sunnyslopes.flowerfarmfinder.FlowerFarmFinderBridge）。
//
// 子模块就绪时：先编 base 的 DLL，再和 Java 代码一起打进 fat jar。
// 子模块未初始化时：跳过原生库，jar 仍然可以构建（运行时 GUI 会报缺少原生库）。
// ---------------------------------------------------------------------------
def baseDir = file('FlowerFinderBase')
def baseCmake = new File(baseDir, 'CMakeLists.txt')
def basePresent = baseDir.isDirectory() && baseCmake.isFile()
def baseCubiomes = new File(baseDir, 'cubiomes/generator.c')
def baseJniBat = new File(baseDir, 'jni/build-jni.bat')
def baseBinDir = new File(baseDir, 'build/bin')
def baseDll = new File(baseBinDir, 'libFlowerFarmFinderLibJ.dll')
def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

// 普通 jar 与 shadowJar 都输出 FlowerFarmFinder-*.jar，必须都带入口类，
// 否则后执行的任务会盖掉带 Main-Class 的包。
jar {
    archiveBaseName.set('FlowerFarmFinder')
    // 同一份资源（源集输出 + processResources 输出）只允许写一次
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': mainClassName
        attributes 'Multi-Release': 'true'
    }
}

// 配置 Shadow JAR
shadowJar {
    archiveBaseName.set('FlowerFarmFinder')
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': mainClassName
        attributes 'Multi-Release': 'true'
    }
}

tasks.register('buildNativeWindows', Exec) {
    group = 'build'
    description = 'Builds libFlowerFarmFinderLibJ.dll from the FlowerFinderBase submodule'
    workingDir = new File(baseDir, 'jni')
    commandLine 'cmd', '/c', 'build-jni.bat'
    // build-jni.bat 自己会找 JDK；这里优先把 Gradle 正在用的 JDK 传过去。
    def runningJavaHome = System.getProperty('java.home')
    if (file("${runningJavaHome}/include/jni.h").exists()) {
        environment 'JAVA_HOME', runningJavaHome
    }
    onlyIf {
        // 只有在 Windows 且子模块连接正确时才构建原生库
        isWindows && basePresent && baseCubiomes.isFile() && baseJniBat.isFile()
    }
    inputs.files(fileTree(baseDir) {
        include 'CMakeLists.txt', 'build.ps1'
        include 'src/**', 'include/**', 'cts/**', 'cxx_compat/**'
        include 'jni/*.cpp', 'jni/*.h', 'jni/*.bat'
        include 'cubiomes/*.c', 'cubiomes/*.h', 'cubiomes/tables/**'
        exclude 'build/**'
    })
    outputs.file(baseDll)
}

tasks.register('prepareNativeResources') {
    group = 'build'
    description = 'Collects the prebuilt native library from FlowerFinderBase into jar resources'
    dependsOn tasks.named('buildNativeWindows')
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()

        if (!basePresent) {
            logger.warn(
                'FlowerFinderBase submodule is not initialized: the jar will NOT contain ' +
                'the native search library. Run "git submodule update --init --recursive".')
            return
        }
        if (!baseCubiomes.isFile()) {
            logger.warn(
                'FlowerFinderBase/cubiomes submodule is not initialized: the jar will NOT ' +
                'contain the native search library. Run "git submodule update --init --recursive".')
            return
        }

        // 优先使用本次构建产出的 DLL；也接受 base 仓库里已经构建好的产物。
        if (isWindows) {
            if (!baseDll.isFile()) {
                throw new GradleException(
                    "Missing ${baseDll}. Build it with: FlowerFinderBase\\jni\\build-jni.bat")
            }
            copy {
                from(baseBinDir)
                include('*.dll')
                into(new File(outDir, 'native/windows'))
            }
        }
        // 其他平台：若 base 里已有对应产物（例如在 Linux/macOS 上预先构建），一并打包。
        def linuxDir = new File(baseBinDir, 'native/linux')
        if (linuxDir.isDirectory()) {
            copy {
                from(linuxDir)
                include('*.so')
                into(new File(outDir, 'native/linux'))
            }
        }
        def macosDir = new File(baseBinDir, 'native/macos')
        if (macosDir.isDirectory()) {
            copy {
                from(macosDir)
                include('*.dylib')
                into(new File(outDir, 'native/macos'))
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
    // 分发物（普通 jar / fat jar）内附带 MIT 许可全文
    from('LICENSE')
}

// 创建 FlowerFarmFinder 的可执行 JAR
tasks.register('buildMainJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for FlowerFarmFinder (GUI + FlowerFinderBase native library)'
    archiveBaseName.set('FlowerFarmFinder')
    archiveClassifier.set('')
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    // 同一份资源（源集输出 + processResources 输出）只允许写一次
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': mainClassName
        attributes 'Multi-Release': 'true'
    }
    mergeServiceFiles()
    transform(Log4j2PluginsCacheFileTransformer)
    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    // 注意：不要排除 META-INF/versions/**，因为 Multi-Release JAR 需要这些文件
    exclude 'module-info.class'
}

tasks.named('buildMainJar') {
    dependsOn tasks.named('prepareNativeResources')
}

// 创建所有 JAR 的任务
tasks.register('buildAllJars') {
    group = 'build'
    description = 'Builds all executable JARs'
    dependsOn buildMainJar
}
