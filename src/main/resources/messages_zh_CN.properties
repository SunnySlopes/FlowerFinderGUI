error.minZGreaterThanMaxZ=MinZ 必须小于 MaxZ
error.searchAreaTooLarge=搜索区域范围过大（不能超过最大世界边界），请缩小范围
error.flowerCenterInvalid=繁花森林离边距离必须是非负整数
error.flowerCenterTooLarge=繁花森林离边距离过大：要求区域中心区必须保留，最大值 {0}
hint.hardReq=硬性要求（必须满足才出结果）：窗口内需有花林+沼泽（1.21.4+ 另需苍白花园）；<br>繁花面积&gt;2000且高度差32格内同时出现蒲公英与铃兰噪声端
hint.softReq=软性要求（仅排序/标注）：樱花、野花加分、地狱群系等；有樱花优先，再按距原点更近
hint.fastModeNote=快速模式使用边界筛选；取消勾选则整窗精确校验
hint.filters=筛选：两种野花要求同一窗口内同时出现野花与樱花；<br>玄武岩三角洲按对应下界窗口判断；横向/竖向按 X、Z 跨度判断；<br>繁花森林离边距离要求两处花梯度极端都落在中心区内（距窗口四边均 ≥ 该距离）。
hint.samplingY=模距会按正方形写入长边 = 32×模距+16（封顶 1024），并取消短边勾选；
hint.outputHint=程序将在进度条走完时输出结果（可再点排序）
