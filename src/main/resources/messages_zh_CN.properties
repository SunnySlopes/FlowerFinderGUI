error.longSideInvalid=搜索区域长边距离必须为 256 到 1024 之间的整数
error.shortSideInvalid=短边距离必须为整数，且不能大于长边距离
error.viewDistanceInvalid=视野距离必须为 8 到 32 之间的整数，且小于长边距离 256 到 1024
error.minXMustBeInteger=MinX必须为整数，已重置为默认值
error.minXFormatError=MinX格式错误，已重置为默认值
error.maxXMustBeInteger=MaxX必须为整数，已重置为默认值
error.maxXFormatError=MaxX格式错误，已重置为默认值
error.minZMustBeInteger=MinZ必须为整数，已重置为默认值
error.minZFormatError=MinZ格式错误，已重置为默认值
error.maxZMustBeInteger=MaxZ必须为整数，已重置为默认值
error.maxZFormatError=MaxZ格式错误，已重置为默认值
