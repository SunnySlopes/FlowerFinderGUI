# 错误提示信息
error.seedRequired=请输入种子值
error.searchBusy=另一个任务正在运行中，请稍后重试。
error.seedMustBeInteger=种子必须为整数
error.seedFormatError=种子格式错误，请输入数字
error.seedOutOfRange=种子值超出范围（必须为不超过2^63-1）
error.threadCountRequired=线程数必须大于0
error.threadCountMustBeInteger=线程数必须为整数
error.threadCountFormatError=线程数格式错误，请输入数字
